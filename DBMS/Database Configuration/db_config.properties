# ==============================================================================
# SMART CAMPUS EVENT MANAGEMENT SYSTEM - DATABASE CONFIGURATION
# Scenario 6: Smart Campus Event Management and Student Participation Analysis
# Register Numbers: 6, 36, 66, 96
# ==============================================================================

# Primary Database Type: sqlite (zero-config, portable, self-contained)
# Supported types: sqlite, mysql
db.type=sqlite

# SQLite Configuration
db.sqlite.url=jdbc:sqlite:DBMS/smart_campus_events.db
db.sqlite.fallback_path=smart_campus_events.db
db.sqlite.driver=org.sqlite.JDBC

# MySQL Configuration (Alternative / Production Environment)
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.database=smart_campus_events
db.mysql.user=root
db.mysql.password=root
db.mysql.driver=com.mysql.cj.jdbc.Driver

# Connection Pool / Transaction Settings
db.connection.auto_commit=false
db.connection.timeout=30000
db.pool.max_size=10
